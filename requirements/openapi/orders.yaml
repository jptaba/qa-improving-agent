openapi: 3.0.3
info:
  title: Demo Orders API
  version: 1.0.0
  description: Frozen at requirement sign-off for REQ-160. Changes require a new requirement version.
servers:
  - url: http://localhost:4173
paths:
  /api/login:
    post:
      summary: Sign in and receive a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in; sets the `session` cookie
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        '401':
          description: Invalid credentials
  /api/orders:
    post:
      summary: Create an order from the demo cart
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Card unknown or expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
  schemas:
    OrderRequest:
      type: object
      required: [cardId, items]
      properties:
        cardId: { type: string, example: card_visa }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { type: string }
              qty: { type: integer, minimum: 1 }
    Order:
      type: object
      required: [id, total, currency, status]
      properties:
        id: { type: string }
        total: { type: number, example: 35.5 }
        currency: { type: string, enum: [USD] }
        status: { type: string, enum: [confirmed] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: card_expired }
