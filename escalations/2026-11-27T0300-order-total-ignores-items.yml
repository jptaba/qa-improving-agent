summary: |
  POST /api/orders ignores the items it is sent, so the total never changes.

  Signed in as demo@example.com, POST /api/orders with a valid card and
  these bodies all return 201 with total 35.5:
    items: [{ "sku": "A", "qty": 1 }]
    items: [{ "sku": "A", "qty": 1000000000 }]
    items: [{ "sku": "ZZZ", "qty": 1 }]    (a sku that is not in the cart)
  The server always charges the fixed demo cart (Widget x2, Gadget x1).
  Unknown skus are accepted and quantities are never priced.

  REQ-150 AC1 says the total is the sum of quantity x unit price, and
  REQ-160 AC1 says a valid order gets 201. Neither says what an order for
  other items or other quantities should cost, or whether an unknown sku
  should be refused. For the one-cart demo the UI is correct, so this may
  be accepted demo behaviour.

  Steps to reproduce:
    1. POST /api/login with demo@example.com / correct-horse; keep cookie.
    2. POST /api/orders {"cardId":"card_visa","items":[{"sku":"ZZZ","qty":1}]}
    3. Observe 201 {"total":35.5,...}.

  Options: (a) the demo cart is the only valid order, so reject items that
  differ with 400/422; (b) price the submitted items from a catalogue;
  (c) accepted demo limitation, no change.

evidence: |
  Live requests on 2026-11-27 against node demo-aut/server.mjs (no FAULT).
  Code: demo-aut/server.mjs, POST /api/orders uses cartTotal() only.

