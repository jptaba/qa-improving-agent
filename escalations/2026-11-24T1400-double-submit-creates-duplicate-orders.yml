  re-enabled when it fails (demo-aut/server.mjs).
  Tests: tests/checkout/single-payment.spec.ts, tagged @REQ-180. The
  repeat-click test failed on the old code; both pass 5/5 now.
  Still needs a person: add REQ-180 to requirements/ and the inventory,
  using proposals/requirement-draft-REQ-180-single-payment.md.
  Not fixed (out of scope in the draft): server-side duplicate detection,
  and paying again after Back from the confirmation page.
