requirement_id: REQ-101
status: open            # open | answered | done
raised: 2026-11-24
test: npm run contract:fuzz (Schemathesis check ST201 on POST /api/login, case 634Un2)

summary: |
  SECURITY: the sign-in API lets anyone in without a password.

  POST /api/login with no body, with {}, or with any unknown email and no
  password returns 200 and a valid session cookie.

  Cause: demo-aut/server.mjs line 172 checks
    USERS[body.email] !== body.password
  For an unknown email and a missing password both sides are `undefined`,
  so the check passes.

  The sign-in page is not affected (the form always sends a password, even
  an empty one), so the REQ-101 UI tests stay green. Only direct API
  callers can do this. The contract (requirements/openapi/orders.yaml)
  says email and password are both required.

  Suggested fix: reject the request unless email and password are both
  strings, or check that the email exists before comparing passwords.

  Also seen, low priority, no requirement covers it: methods the contract
  does not list (for example TRACE /api/orders) return 404 instead of 405.

evidence: |
  With the app running (npm run aut):
    curl -X POST http://localhost:4173/api/login
    -> 200 {"ok":true} plus a Set-Cookie header
