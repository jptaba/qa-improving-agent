answer:
  decision: fix-app-and-add-requirement   # fix-app-and-add-requirement | not-a-bug
  notes: |
    Approved 2026-11-25 ("Proceed").

resolution: |
  2026-11-25. Correction to the summary: the walk used the same account in
  both sessions, so it showed the same shopper seeing their own order,
  which is fine. The real gap was that orders had no owner at all, so a
  second account would have seen them too.
  App: each order now records who placed it; unknown ids and other
  shoppers' orders get 404 "Order not found". Added a second demo account
  (other@example.com) so this can be tested.
  Tests: tests/checkout/order-ownership.spec.ts, tagged @REQ-190. Both
  failed on the old code and pass 5/5 now.
  Still needs a person: add REQ-190 to requirements/ and the inventory,
  using proposals/requirement-draft-REQ-190-order-ownership.md.
  Done 2026-11-26: REQ-190 is in requirements/ and the inventory (T-0190-01),
  with sealed checks and the foreign-order-visible planted fault.
