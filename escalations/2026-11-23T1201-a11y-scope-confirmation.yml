resolution: |
  Needs a human edit first (agents may not change requirements/).
  In requirements/REQ-170-accessibility.md:
    - title:   Accessible pages
    - journey: Sign in, Checkout, Confirmation, Not found
    - AC1:     THE SYSTEM SHALL have no automatically detectable WCAG 2.2
               A/AA violations on every page, including the sign-in,
               checkout, order confirmation and "page not found" pages.
  Then ask Claude to add the confirmation and not-found tests.

