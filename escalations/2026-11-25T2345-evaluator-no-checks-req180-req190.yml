    Chosen 2026-11-25: keeps the evaluator independent of the builder suite.

resolution: |
  Needs the owner of sealed-acceptance/ (agents may not read or edit it).
  What each check must show, taken only from the requirement text, so the
  evaluator stays independent of tests/:

  REQ-180 (requirements/REQ-180-single-payment.md)
    AC1  While a payment is in progress, a second Pay now from Checkout
         is not submitted: one order results, not two.
    AC2  After a failed payment (e.g. an expired card), the shopper can
         pay again from Checkout and the order goes through.
    Out of scope: idempotency key; paying again after Back from
    confirmation. Do not check these.

  REQ-190 (requirements/REQ-190-order-ownership.md)
    AC1  The buyer opens their own order's confirmation page: it shows.
    AC2  Another signed-in shopper opens that page: 404 and
         "Order not found". Accounts are in the requirement's
         reference data.
    AC3  A made-up order id: 404 and "Order not found".

  Done when: npm run canary shows evaluator TNR 100% and pass^k true,
  with every planted fault still caught. Then ask Claude to set this
  escalation to done.

  Planted faults so the canary proves the new checks can fail
  (2026-11-25, already in demo-aut/server.mjs, switched on with FAULT):
    double-submit          REQ-180  no in-flight guard on Pay now;
                                    repeat clicks create extra orders
    foreign-order-visible  REQ-190  any signed-in shopper can open
                                    another shopper's confirmation page
  Builder suite against each: exactly one test fails, and it is the one
  for the fault's own requirement. Healthy build: 40/40.
  Still to do by the owner: add both ids to the faults list in
  sealed-acceptance/seeded-faults/catalogue.json with their
  requirement_id and a split (optimisation or holdout; at least one in
  holdout keeps the held-out score meaningful).

  2026-11-26: done. Catalogue entries landed with PR #1
  (double-submit optimisation, foreign-order-visible holdout). The blind
  evaluator author (cloud task, checkout without tests/) added 5 sealed
  checks, one per AC, in PR #3; each fault fails its own requirement.
  Canary on main afterwards: suite and evaluator both caught 100% (all and
  holdout), TNR 100%, pass^k true, impossible build never green.
  Gap left: REQ-180 AC2 and REQ-190 AC1/AC3 have no planted fault yet,
  so they are proven only on the healthy app.
