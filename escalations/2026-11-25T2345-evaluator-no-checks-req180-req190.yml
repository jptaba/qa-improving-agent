summary: |
  The sealed evaluator has no checks for REQ-180 and REQ-190, so the
  canary now reports every healthy build as a false alarm (evaluator TNR 0%).

  REQ-180 and REQ-190 were added to requirements/ in commit 21be4a8. The
  evaluator reads every requirement there. For both it returns
  "could_not_verify: No acceptance check covers this requirement yet", and
  that makes each healthy evaluator run exit non-zero. Every other
  requirement passes on a healthy build, and all 5 planted faults are
  still caught by the evaluator (TPR 100%, impossible build rejected).

  The builder suite is unaffected: TNR 100%, TPR 100%, and its own tests
  for both requirements pass (tests/checkout/single-payment.spec.ts,
  tests/checkout/order-ownership.spec.ts).

  The last canary before 21be4a8 showed evaluator TNR 100%, so this is
  caused by adopting the requirements, not by the review fixes applied in
  the same run. Agents may not read or edit sealed-acceptance/, so a
  person has to decide.

